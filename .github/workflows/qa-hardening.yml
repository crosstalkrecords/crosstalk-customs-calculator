name: Sandbox QA hardening
on:
  push:
    paths: ['.github/workflows/qa-hardening.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Apply guarded QA fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('easy-track-builder-sandbox.html'); s=p.read_text()
          def rep(a,b,label):
            global s
            if a not in s: raise SystemExit(label+' anchor missing')
            s=s.replace(a,b,1)
          rep("function canAdvance(from){if(from===1&&!state.promo&&!state.size){showValidation('validate1');return false}if(from===2&&!tracklist()){showValidation('validate2');return false}if(from===4&&!state.audio){showValidation('validate4');return false}return true}",
          "function invalidDurations(){return qRows().some(r=>{const n=r.querySelector('.tn').value.trim(),d=r.querySelector('.td').value.trim();return n&&d&&!/^(\\d+):([0-5]\\d)$/.test(d)})}function overRuntime(){if(!state.size||!state.rpm)return false;return activeSides().some(s=>sideTotal(s)>dur(lim()))}function canAdvance(from){if(from===1&&!state.promo&&!state.size){showValidation('validate1');return false}if(from===2&&!tracklist()){showValidation('validate2');return false}if(from===2&&invalidDurations()) {showValidation('validate2','Use track times in m:ss format (for example 3:45), or leave the time blank.');return false}if(from===2&&overRuntime()){showValidation('validate2','One or more sides are over the available runtime. Trim or move tracks before continuing.');return false}if(from===4&&!state.audio){showValidation('validate4');return false}return true}",'advance')
          rep("function tracklist(){if($('manual').value.trim())return $('manual').value.trim();const side=s=>all(`#tracks${s} .track`).map((r,i)=>{const n=r.querySelector('.tn').value.trim(),d=r.querySelector('.td').value.trim();return n?`${s}${i+1} - ${n}${d?` (${d})`:''}`:null}).filter(Boolean).join('\\n');return activeSides().map(side).filter(Boolean).join('\\n\\n')}",
          "function builderTracklist(){const side=s=>all(`#tracks${s} .track`).map((r,i)=>{const n=r.querySelector('.tn').value.trim(),d=r.querySelector('.td').value.trim();return n?`${s}${i+1} - ${n}${d?` (${d})`:''}`:null}).filter(Boolean).join('\\n');return activeSides().map(side).filter(Boolean).join('\\n\\n')}function tracklist(){const manual=$('manual').value.trim(),built=builderTracklist();return manual&&!built?manual:built||manual}",'tracklist')
          old="$('promoInfo').onclick=()=>{$('promoDetails').classList.toggle('open');$('promoInfo').textContent=$('promoDetails').classList.contains('open')?'Hide details':'See Father\\'s Day Special'};$('promoStart').onclick=()=>{collapseDoubleLP();state.mode='regular';state.promo=true;state.size='12';state.qty=1;state.rpm='33 RPM';state.colour='Clear';state.pack='Printed Jacket + Labels';go(1);recordUI()};$('regularStart').onclick=()=>{collapseDoubleLP();state.mode='regular';state.promo=false;state.size=null;state.rpm=null;go(1);recordUI()}"
          new="function resetStandardBuild(mode){collapseDoubleLP();state.mode=mode;state.promo=false;state.size=null;state.qty=1;state.rpm=null;state.colour='Clear';state.pack='Standard';state.rush=false;state.shipping=false;$('qty').value=1;$('delivery').value='pickup';$('rush').checked=false;$('shipping').classList.add('hidden');syncLookChoices()}$('promoInfo').onclick=()=>{$('promoDetails').classList.toggle('open');$('promoInfo').textContent=$('promoDetails').classList.contains('open')?'Hide details':'See Father\\'s Day Special'};$('promoStart').onclick=()=>{collapseDoubleLP();state.mode='regular';state.promo=true;state.size='12';state.qty=1;state.rpm='33 RPM';state.colour='Clear';state.pack='Printed Jacket + Labels';$('qty').value=1;go(1);recordUI()};$('regularStart').onclick=()=>{resetStandardBuild('regular');go(1);recordUI()}"
          rep(old,new,'mode reset')
          rep("$('artistContinue').onclick=()=>{collapseDoubleLP();state.promo=false;state.size=null;state.rpm=null;go(1);recordUI()}","$('artistContinue').onclick=()=>{resetStandardBuild('artist');go(1);recordUI()}",'artist reset')
          rep("$('qty').oninput=e=>{state.qty=Math.max(1,+e.target.value||1);if(state.size==='12'&&state.qty>5){state.qty=5;e.target.value=5}state.promo=false;priceUI()}","$('qty').oninput=e=>{const next=Math.max(1,+e.target.value||1);if(state.doubleLP&&next!==1)collapseDoubleLP();state.qty=next;if(state.size==='12'&&state.qty>5){state.qty=5;e.target.value=5}state.promo=false;priceUI();totals();refreshDoubleLPOffer()}",'qty')
          rep("$('rpm').onchange=e=>{state.rpm=e.target.value;state.promo=false;$('runtime').innerHTML=`Selected setup: <strong>${state.rpm}</strong> · up to <strong>${lim()} per side</strong>`;totals();priceUI()}","$('rpm').onchange=e=>{if(state.doubleLP)collapseDoubleLP();state.rpm=e.target.value;state.promo=false;$('runtime').innerHTML=`Selected setup: <strong>${state.rpm}</strong> · up to <strong>${lim()} per side</strong>`;totals();priceUI();refreshDoubleLPOffer()}",'rpm')
          # Make legacy compatibility: only established live-form field names are submitted.
          p.write_text(s)
          PY
      - name: QA gates
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('easy-track-builder-sandbox.html').read_text()
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/sandbox.js').write_text('\n'.join(scripts))
          names=re.findall(r'<(?:input|select|textarea)\b[^>]*\bname="([^"]+)"',s)
          allowed={'Artist Order','Estimated Price Given','Side A Length','Side B Length','Record Size','Speed','Sides','Quantity','Tracklist','Rush','Shipping Required','Customer Name','Email','Custom Field 1','Street Address','Suburb','Postcode','State','Packaging','Vinyl Colour'}
          extra=sorted(set(names)-allowed)
          if extra: raise SystemExit('Unexpected submitted fields: '+repr(extra))
          required={'Artist Order','Estimated Price Given','Side A Length','Side B Length','Record Size','Speed','Sides','Quantity','Tracklist','Rush','Shipping Required','Customer Name','Email','Custom Field 1','Street Address','Suburb','Postcode','State'}
          missing=sorted(required-set(names))
          if missing: raise SystemExit('Missing legacy fields: '+repr(missing))
          print('submitted fields:',sorted(set(names)))
          PY
          node --check /tmp/sandbox.js
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add easy-track-builder-sandbox.html
          git commit -m 'Harden sandbox state and validation for launch'
          git push origin main