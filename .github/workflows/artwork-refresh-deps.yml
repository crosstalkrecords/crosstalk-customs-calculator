name: Refresh artwork review dependencies

on:
  push:
    branches:
      - artwork-form-handoff-review-20261119
    paths:
      - .github/workflows/artwork-refresh-deps.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: artwork-form-handoff-review-20261119
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update vulnerable pinned packages
        working-directory: artwork-service
        run: |
          npm install image-size@2.1.0 --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit review-only dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artwork-service/package.json artwork-service/package-lock.json
          git diff --cached --quiet || (git commit -m "Refresh artwork exporter dependency patches" && git push origin HEAD:artwork-form-handoff-review-20261119)
