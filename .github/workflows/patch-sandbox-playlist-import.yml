name: Patch sandbox playlist importer

on:
  push:
    paths:
      - '.github/workflows/patch-sandbox-playlist-import.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire playlist importer into sandbox
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('easy-track-builder-sandbox.html')
          s = p.read_text()
          old = "$('playlistTry').onclick=()=>{$('playlistMsg').innerHTML=$('playlistUrl').value.trim()?'<strong>Playlist importing is the next integration pass.</strong> For now, add at least one track below so we can keep testing the guided flow.':'Paste a public playlist link first.'};"
          new = r'''$('playlistTry').onclick=async()=>{const url=$('playlistUrl').value.trim(),btn=$('playlistTry');if(!url){$('playlistMsg').textContent='Paste a public Spotify or Apple Music playlist link first.';return}btn.disabled=true;btn.textContent='Importing...';$('playlistMsg').textContent='Reading your public playlist…';try{const res=await fetch('https://crosstalk-playlist-importer.vercel.app/api/playlist?url='+encodeURIComponent(url));const data=await res.json();if(!res.ok||!data.ok)throw new Error(data.error||'Could not read that playlist.');const tracks=Array.isArray(data.tracks)?data.tracks:[];if(!tracks.length)throw new Error('No tracks were found in that playlist.');$('tracksA').innerHTML='';$('tracksB').innerHTML='';$('manual').value='';const secs=tracks.map(t=>dur(String(t.duration||'').replace(/^0+/,''))),grand=secs.reduce((a,b)=>a+b,0),half=grand/2;let run=0,split=tracks.length;for(let i=0;i<tracks.length-1;i++){run+=secs[i];if(run>=half){const prev=Math.abs((run-secs[i])-half),now=Math.abs(run-half);split=now<=prev?i+1:i;break}}if(tracks.length>1)split=Math.max(1,Math.min(tracks.length-1,split));tracks.forEach((t,i)=>{const side=i<split?'A':'B';addTrack(side);const row=$(`tracks${side}`).lastElementChild;row.querySelector('.tn').value=[t.artist,t.title].filter(Boolean).join(' — ');row.querySelector('.td').value=String(t.duration||'').replace(/^0+(?=\d+:)/,'')});totals();clearValidation('validate2');const provider=data.provider==='apple'?'Apple Music':'Spotify',tooLong=state.size&&state.rpm&&grand>dur(lim())*2;$('playlistMsg').innerHTML=`<strong>${tracks.length} tracks imported from ${provider}.</strong> We've split them roughly evenly across Side A and Side B.${tooLong?' <span style="color:#a52320;font-weight:800">This playlist is longer than the selected record can hold, so trim tracks until both runtime bars fit.</span>':' You can move, remove or edit tracks from here.'}`}catch(err){$('playlistMsg').innerHTML=`<span style="color:#a52320;font-weight:800">${String(err.message||err)}</span> Try a public Spotify or Apple Music playlist link, or add tracks manually below.`}finally{btn.disabled=false;btn.textContent='Use playlist'}};'''
          if old not in s:
              raise SystemExit('Expected playlist placeholder handler not found; refusing to patch.')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit sandbox integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add easy-track-builder-sandbox.html
          git commit -m "Connect sandbox track builder to live playlist importer"
          git push origin main
