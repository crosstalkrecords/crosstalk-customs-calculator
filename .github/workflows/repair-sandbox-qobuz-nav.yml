name: Repair sandbox Qobuz and navigation
on:
  push:
    paths:
      - 'scripts/repair_sandbox_qobuz_nav.py'
      - 'scripts/final_hardening_fix.py'
      - '.github/workflows/repair-sandbox-qobuz-nav.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/repair_sandbox_qobuz_nav.py
      - run: python scripts/final_hardening_fix.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('easy-track-builder-sandbox.html').read_text()
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/crosstalk-sandbox.js').write_text(js)
          PY
          node --check /tmp/crosstalk-sandbox.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add easy-track-builder-sandbox.html
          git commit -m "Repair sandbox navigation and add Qobuz sourcing"
          git push origin main
