name: Fix artist custom finish pricing

on:
  push:
    paths:
      - '.github/workflows/fix-artist-custom-finish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch appearance pricing state
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('easy-track-builder-sandbox.html')
          s = p.read_text()

          old_choices = "function chooseColour(v){state.promo=false;state.colour=v;all('#colours .choice').forEach(b=>b.classList.toggle('selected',b.dataset.colour===v));updateModeScreens();priceUI()}function choosePack(v){state.promo=false;state.pack=v;all('#packs .choice').forEach(b=>b.classList.toggle('selected',b.dataset.pack===v));if(v==='Custom Finish Pack'&&state.colour==='Clear')state.colour='Black';all('#colours .choice').forEach(b=>b.classList.toggle('selected',b.dataset.colour===state.colour));updateModeScreens();priceUI()}"
          new_choices = "function syncLookChoices(){if(state.pack==='Custom Finish Pack'&&state.colour==='Clear')state.colour='Black';all('#colours .choice').forEach(b=>b.classList.toggle('selected',b.dataset.colour===state.colour));all('#packs .choice').forEach(b=>b.classList.toggle('selected',b.dataset.pack===state.pack))}function chooseColour(v){state.promo=false;if(v==='Clear'&&state.pack==='Custom Finish Pack')state.pack='Printed Jacket + Labels';state.colour=v;syncLookChoices();updateModeScreens();priceUI()}function choosePack(v){state.promo=false;state.pack=v;if(v==='Custom Finish Pack'&&state.colour==='Clear')state.colour='Black';syncLookChoices();updateModeScreens();priceUI()}"
          if old_choices not in s:
              raise SystemExit('Choice-state anchor not found; refusing to patch')
          s = s.replace(old_choices, new_choices, 1)

          old_price = "function priceUI(){['price1','price2','price3'].forEach(id=>{if($(id))$(id).textContent=state.size||state.promo?'$'+totalPrice().toFixed(2):'Choose a size'});const u=CONFIG[state.mode].up;$('blackP').textContent=`+$${u.colour}`;$('redP').textContent=`+$${u.colour}`;$('printedP').textContent=`+$${u.printed}`;$('customP').textContent=`+$${u.custom} · coloured vinyl + printed jacket + labels`;['priceLabel1','priceLabel2','priceLabel3'].forEach(id=>$(id).textContent=state.promo?'Father\\'s Day Special':'Current estimate');updatePrintedPrice();sync()}"
          new_price = "function priceUI(){syncLookChoices();['price1','price2','price3'].forEach(id=>{if($(id))$(id).textContent=state.size||state.promo?'$'+totalPrice().toFixed(2):'Choose a size'});const u=CONFIG[state.mode].up,colourIncluded=state.pack==='Custom Finish Pack';$('blackP').textContent=colourIncluded?'Included in Custom Finish Pack':`+$${u.colour}`;$('redP').textContent=colourIncluded?'Included in Custom Finish Pack':`+$${u.colour}`;$('printedP').textContent=`+$${u.printed}`;$('customP').textContent=`+$${u.custom} · Black or Transparent Red vinyl + printed jacket + labels`;['priceLabel1','priceLabel2','priceLabel3'].forEach(id=>$(id).textContent=state.promo?'Father\\'s Day Special':'Current estimate');updatePrintedPrice();sync()}"
          if old_price not in s:
              raise SystemExit('Pricing UI anchor not found; refusing to patch')
          s = s.replace(old_price, new_price, 1)

          p.write_text(s)
          PY

      - name: JavaScript syntax gate
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s = Path('easy-track-builder-sandbox.html').read_text()
          scripts = re.findall(r'<script\b[^>]*>(.*?)</script>', s, re.S)
          if not scripts:
              raise SystemExit('No inline JavaScript found')
          Path('/tmp/sandbox.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/sandbox.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add easy-track-builder-sandbox.html
          git diff --cached --check
          git commit -m "Fix custom finish colour pricing flow"
          git push origin main
