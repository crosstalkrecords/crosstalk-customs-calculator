name: Qobuz match POC

on:
  push:
    paths:
      - 'qobuz-match-poc.js'
      - '.github/workflows/qobuz-match-poc.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node qobuz-match-poc.js
