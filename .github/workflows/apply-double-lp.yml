name: Apply 2xLP sandbox experiment
on:
  push:
    paths:
      - 'scripts/patch_double_lp.py'
      - '.github/workflows/apply-double-lp.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch sandbox
        run: python scripts/patch_double_lp.py
      - name: Commit sandbox
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add easy-track-builder-sandbox.html
          git commit -m "Add conditional 2xLP sandbox flow"
          git push origin main
