name: Playlist extraction POC

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: Public Spotify or Apple Music playlist URL
        required: false
        default: https://music.apple.com/au/playlist/dolly-parton-essentials/pl.bca7ed31389842108896524e2edbd956
  push:
    paths:
      - 'playlist-extract-poc.js'
      - '.github/workflows/playlist-extract-poc.yml'

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Extract rendered public playlist
        env:
          PLAYLIST_URL: ${{ inputs.playlist_url || 'https://music.apple.com/au/playlist/dolly-parton-essentials/pl.bca7ed31389842108896524e2edbd956' }}
        run: node playlist-extract-poc.js
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlist-extract-poc
          path: playlist-extract-poc.png
          if-no-files-found: ignore
