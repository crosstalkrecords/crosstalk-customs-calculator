<!doctype html><html lang="en"><head><meta charset="utf-8"><title>PSD editor-state roundtrip checks</title><style>body{font:14px system-ui;margin:0;background:#eee}header{padding:10px;background:white}button,label{display:inline-block;padding:8px;border:1px solid #aaa;border-radius:5px;margin:3px}input{display:block}iframe{width:100%;height:66vh;border:0}pre{white-space:pre-wrap;margin:0;padding:12px;background:white;max-height:24vh;overflow:auto}</style></head><body><header><strong>Staff PSD checks — synthetic fixtures only</strong><label>Open PSD file<input id="file" type="file" accept=".psd"></label><button id="inspect">Inspect document</button><button id="png">Render PNG</button><button id="refresh">Redraw native text</button><button id="fallback">Use raster text backups</button><button id="edit">Edit native text and opacity</button><button id="save">Save and reopen PSD</button><button id="unmask">Disable photo mask</button><button id="mask">Enable photo mask</button><span id="status">Loading…</span><a id="download" hidden>Download output</a></header><iframe id="pea" title="Photopea test editor"></iframe><pre id="log"></pre><script>
'use strict';const pea=document.getElementById('pea'),log=document.getElementById('log'),status=document.getElementById('status'),file=document.getElementById('file');let ready=false,busy=false,format=null,reopen=false,url=null,waiter=null,timeout=null,filename='output';
function note(x){log.textContent+=(typeof x==='string'?x:JSON.stringify(x))+'\n';log.scrollTop=log.scrollHeight}
function buttons(){for(const id of ['inspect','png','edit','save','mask','unmask','refresh','fallback'])document.getElementById(id).disabled=!ready||busy;file.disabled=!ready||busy}
function send(message){if(!ready||busy)throw Error('Not ready');busy=true;status.textContent='Processing…';buttons();timeout=setTimeout(()=>{status.textContent='Timed out — reload for a clean session';note('TIMEOUT');},45000);pea.contentWindow.postMessage(message,'https://www.photopea.com')}
const walk='function flat(ls){var a=[];for(var i=0;i<ls.length;i++){var l=ls[i];if(l.typename==="LayerSet")a=a.concat(flat(l.layers));else a.push(l);}return a;}';
const audit=walk+'var d=app.activeDocument,ls=flat(d.layers),a=[];for(var i=0;i<ls.length;i++){var l=ls[i],o={name:l.name,visible:l.visible,opacity:l.opacity};if(l.kind==LayerKind.TEXT){o.text=l.textItem.contents;o.font=l.textItem.font;o.tracking=l.textItem.tracking;o.align=String(l.textItem.justification);}a.push(o);}app.echoToOE(JSON.stringify({event:"audit",width:d.width,height:d.height,layers:a}));';
window.addEventListener('message',e=>{if(e.origin!=='https://www.photopea.com'||e.source!==pea.contentWindow)return;if(e.data==='done'){clearTimeout(timeout);ready=true;busy=false;status.textContent='Ready';buttons();if(reopen){reopen=false;send(audit)}return}if(typeof e.data==='string'){note(e.data);return}if(e.data instanceof ArrayBuffer&&format){const kind=format;format=null;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob([e.data],{type:kind==='psd'?'image/vnd.adobe.photoshop':'image/png'}));const a=document.getElementById('download');a.href=url;a.download=filename+'-photopea.'+kind;a.hidden=false;note({event:'export',format:kind,bytes:e.data.byteLength});if(kind==='psd'){reopen=true;pea.contentWindow.postMessage(e.data,'https://www.photopea.com');note('Reopening exported PSD')}}});
file.onchange=async()=>{if(!file.files[0])return;filename=file.files[0].name.replace(/\.psd$/i,'');const data=await file.files[0].arrayBuffer();note('Opening '+filename);send(data);file.value=''};
document.getElementById('inspect').onclick=()=>send(audit);
document.getElementById('png').onclick=()=>{format='png';send('app.activeDocument.saveToOE("png");')};
document.getElementById('refresh').onclick=()=>send(walk+'var ls=flat(app.activeDocument.layers);for(var i=0;i<ls.length;i++){var l=ls[i];if(l.kind==LayerKind.TEXT){var old=l.textItem.contents;l.textItem.contents=old+" ";l.textItem.contents=old;}}app.echoToOE("Native text regenerated with original wording");');
document.getElementById('fallback').onclick=()=>send(walk+'var ls=flat(app.activeDocument.layers);for(var i=0;i<ls.length;i++){var l=ls[i];if(l.kind==LayerKind.TEXT)l.visible=false;if(l.name.indexOf("Preview backup")===0)l.visible=true;}app.echoToOE("Raster text backups enabled");');
document.getElementById('edit').onclick=()=>send(walk+'var ls=flat(app.activeDocument.layers);for(var i=0;i<ls.length;i++){var l=ls[i];if(l.kind==LayerKind.TEXT)l.textItem.contents="EDIT "+l.textItem.contents;if(l.name==="Circular gradient")l.opacity=60;}app.echoToOE("Native text edited; gradient opacity changed to 60%");');
document.getElementById('save').onclick=()=>{format='psd';send('app.activeDocument.saveToOE("psd");app.activeDocument.close(SaveOptions.DONOTSAVECHANGES);')};
function maskScript(enabled){return walk+'var ls=flat(app.activeDocument.layers);for(var i=0;i<ls.length;i++){if(ls[i].name==="Synthetic cropped photo"){app.activeDocument.activeLayer=ls[i];var d=new ActionDescriptor();var r=new ActionReference();r.putEnumerated(charIDToTypeID("Lyr "),charIDToTypeID("Ordn"),charIDToTypeID("Trgt"));d.putReference(charIDToTypeID("null"),r);var to=new ActionDescriptor();to.putBoolean(stringIDToTypeID("userMaskEnabled"),'+enabled+');d.putObject(charIDToTypeID("T   "),charIDToTypeID("Lyr "),to);executeAction(charIDToTypeID("setd"),d,DialogModes.NO);}}app.echoToOE("Photo mask enabled: '+enabled+'");'}
document.getElementById('unmask').onclick=()=>send(maskScript(false));document.getElementById('mask').onclick=()=>send(maskScript(true));buttons();
const base='https://raw.githubusercontent.com/crosstalkrecords/crosstalk-customs-calculator/fee73b3ecbba3f91b5cf514986af0e8228fc7271/psd-lab/fonts/';pea.src='https://www.photopea.com/#'+encodeURIComponent(JSON.stringify({resources:['DejaVuSans','DejaVuSans-Bold','DejaVuSerif','DejaVuSansMono-Oblique'].map(n=>base+n+'.ttf')}));
</script></body></html>
