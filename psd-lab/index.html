<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crosstalk PSD compatibility lab</title>
<style>body{margin:0;font:14px system-ui;background:#eee;color:#222}header{padding:12px;background:#fff}h1{font-size:18px;margin:0 0 8px}button,select{padding:9px;margin:3px;border:1px solid #aaa;border-radius:5px}button:disabled{opacity:.4}iframe{width:100%;height:68vh;border:0}pre{background:#fff;max-height:24vh;overflow:auto;margin:0;padding:12px;white-space:pre-wrap}a{margin:8px;display:inline-block}</style>
</head><body><header><h1>Crosstalk PSD compatibility lab — synthetic artwork only</h1><select id="fixture"><option value="cover-small">640 px cover</option><option value="cover-print">3000 px cover</option><option value="label-print">1146 px label</option></select><button id="open">Open fixture</button><button id="inspect" disabled>Inspect layers</button><button id="edit" disabled>Edit text and opacity</button><button id="export" disabled>Export, verify and reopen PSD</button><span id="status">Loading Photopea…</span><a id="download" hidden>Download Photopea output</a></header><iframe id="pea" title="Photopea test editor"></iframe><pre id="log" aria-live="polite"></pre>
<script>
'use strict';
const pea=document.getElementById('pea'),log=document.getElementById('log'),status=document.getElementById('status');
const source='https://raw.githubusercontent.com/crosstalkrecords/crosstalk-customs-calculator/c56d44b0beecc1bb30ffe88cc6cc867378fa1f25/psd-lab/generated/';
let ready=false,busy=false,expectPSD=false,reopening=false,lastURL=null;
function note(v){log.textContent+=(typeof v==='string'?v:JSON.stringify(v,null,2))+'\n';log.scrollTop=log.scrollHeight}
function controls(){for(const id of ['inspect','edit','export'])document.getElementById(id).disabled=!ready||busy;document.getElementById('open').disabled=!ready||busy}
function send(script){if(!ready||busy)return;busy=true;status.textContent='Photopea processing…';controls();pea.contentWindow.postMessage(script,'https://www.photopea.com')}
function layerExpression(){return document.getElementById('fixture').value.startsWith('label-print')?'d.layers[0].layers':'d.layers'}
function audit(){return 'var d=app.activeDocument;var ls='+layerExpression()+';var a=[];for(var i=0;i<ls.length;i++){var l=ls[i];a.push({name:l.name,visible:l.visible,opacity:l.opacity});}var t=ls.getByName("Editable title - DejaVu Sans");app.echoToOE(JSON.stringify({width:d.width,height:d.height,layers:a,text:t.textItem.contents,font:t.textItem.font}));'}
window.addEventListener('message',e=>{if(e.origin!=='https://www.photopea.com'||e.source!==pea.contentWindow)return;
 if(e.data==='done'){ready=true;busy=false;status.textContent='Ready';controls();if(reopening){reopening=false;send(audit())}return}
 if(typeof e.data==='string'){note(e.data);return}
 if(e.data instanceof ArrayBuffer&&expectPSD){expectPSD=false;try{const view=new DataView(e.data),bytes=new Uint8Array(e.data);if(String.fromCharCode(...bytes.slice(0,4))!=='8BPS')throw Error('Missing PSD signature');note({photopeaExportReceived:true,bytes:e.data.byteLength,height:view.getUint32(14),width:view.getUint32(18),bitsPerChannel:view.getUint16(22),colorMode:view.getUint16(24)});if(lastURL)URL.revokeObjectURL(lastURL);lastURL=URL.createObjectURL(new Blob([e.data],{type:'image/vnd.adobe.photoshop'}));const a=document.getElementById('download');a.href=lastURL;a.download='Photopea-'+document.getElementById('fixture').value+'.psd';a.hidden=false;reopening=true;pea.contentWindow.postMessage(e.data,'https://www.photopea.com');note('Sent Photopea-generated PSD back to Photopea for independent reopen.')}catch(error){note('EXPORT VALIDATION FAILED: '+error.message)}}
});
document.getElementById('open').onclick=()=>{note('Opening '+document.getElementById('fixture').value);send('app.open('+JSON.stringify(source+document.getElementById('fixture').value+'.psd')+');')};
document.getElementById('inspect').onclick=()=>send(audit());
document.getElementById('edit').onclick=()=>send('var d=app.activeDocument;var ls='+layerExpression()+';ls.getByName("Editable title - DejaVu Sans").textItem.contents="EDITABLE SUCCESS\\rSIDE A";ls.getByName("Opacity 25 percent").opacity=40;app.echoToOE("Changed native text and opacity to 40%; no raster replacement.");');
document.getElementById('export').onclick=()=>{expectPSD=true;send('app.activeDocument.saveToOE("psd");')};
for(const name of ['cover-print-no-outline','label-print-no-outline','cover-print-integer-outline','label-print-integer-outline']){const o=document.createElement('option');o.value=name;o.textContent=name;document.getElementById('fixture').appendChild(o)}
pea.src='https://www.photopea.com/#'+encodeURIComponent(JSON.stringify({files:[source+'cover-small.psd']}));
</script></body></html>
